<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Course administration{% endblock %} · MLES Fall 2026</title><style>
:root{--paper:#f8f4ef;--white:#fffdf8;--ink:#12233f;--teal:#167b87;--red:#7f2635;--line:#d8cfc2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Avenir Next",Avenir,sans-serif}header{padding:1.2rem 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:2rem}header>a{font-weight:700;text-decoration:none;color:var(--ink)}header nav{display:flex;align-items:center;gap:1.2rem;font-size:14px}a{color:var(--teal);text-underline-offset:4px}main{max-width:1400px;margin:3rem auto;padding:0 1.5rem}h1,h2,h3{line-height:1.2;margin-top:0}h1{font:400 clamp(2.2rem,4vw,3.3rem)/1.1 Georgia,serif}h2{font:400 2rem/1.15 Georgia,serif}h3{font-size:1.05rem}p{margin-top:0}.eyebrow{font:700 12px/1.5 Menlo,monospace;letter-spacing:.08em;color:var(--red);text-transform:uppercase}.muted{color:#596a77}.panel{background:var(--white);border:1px solid var(--line);padding:2rem;margin-bottom:1.7rem}.admin-grid{display:grid;grid-template-columns:255px 1fr;gap:2rem}.weeks{padding:0;list-style:none}.weeks a{display:block;padding:.6rem .8rem;text-decoration:none;border-left:3px solid transparent;font-size:14px}.weeks .active a{background:#dfedeb;border-color:var(--teal);font-weight:700}.weeks small{display:block;color:#687985;font-size:12px}.field{display:block;margin:1rem 0}.field>span{display:block;font-size:14px;font-weight:700;margin-bottom:.4rem}input,select,textarea{font:16px/1.5 inherit;width:100%;border:1px solid #a5b5bb;padding:.7rem;background:white;color:var(--ink);border-radius:3px}input,select,textarea{font-family:"Avenir Next",sans-serif;font-size:16px}textarea{resize:vertical;min-height:90px}input[type=checkbox]{width:auto}button,.button{display:inline-block;font:700 14px/1.4 "Avenir Next",sans-serif;border:1px solid var(--teal);padding:.7rem 1.1rem;background:var(--teal);color:white;text-decoration:none;border-radius:3px;cursor:pointer}.button.secondary,button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}button.danger{background:var(--red);border-color:var(--red)}.row{display:flex;gap:1rem;align-items:end;flex-wrap:wrap}.row .field{flex:1;min-width:150px}.row form{margin:0}.notice{padding:1rem 1.3rem;background:#dcece7;border-left:4px solid var(--teal);margin:1.2rem 0}.error{background:#f4e0de;border-left-color:var(--red)}.resource{border-top:1px solid var(--line);padding:1.2rem 0}.badge{display:inline-block;padding:.2rem .5rem;background:#e0eeea;font:700 12px Menlo,monospace;margin-right:.5rem}.badge.draft{background:#f1dfc2}.resource details{margin:1rem 0}.resource summary{cursor:pointer;color:var(--teal)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:.7rem .4rem;text-align:left;overflow-wrap:anywhere}small.help{font-size:13px;line-height:1.6;color:#637583;display:block;margin-top:.35rem}.login{max-width:470px;margin:6rem auto}.inline{display:inline}header form button{padding:.4rem .7rem}code{font-family:Menlo,monospace;font-size:.85em}.file-links{overflow-wrap:anywhere}.access-message{font-size:14px;max-width:60rem}details>summary{cursor:pointer}details.panel>summary h2{display:inline}.audit{overflow-x:auto}footer{color:#617482;padding:2rem;text-align:center;font:12px Menlo,monospace}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem}.weeks a{font-size:12px}.weeks small{display:none}.panel{padding:1.2rem}.row{display:block}.row button{margin:.3rem 0}header{flex-wrap:wrap;gap:1rem}main{padding:0 1rem}.login{margin:3rem 1rem}.audit table{min-width:600px}}
</style></head><body><header><a href="/">Machine Learning in Engineering Science</a><nav><a href="/">Student website</a>{% if session.get('user') %}<a href="{{ url_for('dashboard') }}">Administration</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="secondary">Sign out</button></form>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<p class="notice">{{ message }}</p>{% endfor %}{% block body %}{% endblock %}</main><footer>NCKU + LAiMM · Fall 2026 · Course administration</footer></body></html>
