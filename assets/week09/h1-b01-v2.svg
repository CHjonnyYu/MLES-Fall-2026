<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="A good average begins an investigation"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">A good average begins an investigation</text><text x="240.0" y="130.0" font-size="25" text-anchor="middle" fill="#12233f">Evidence question</text><text x="610.0" y="130.0" font-size="25" text-anchor="middle" fill="#12233f">Look for</text><path d="M55 160 H795" stroke="#657983" stroke-width="2"/><text x="240.0" y="215.0" font-size="26" text-anchor="middle" fill="#12233f">Where does it fail?</text><text x="610.0" y="215.0" font-size="26" text-anchor="middle" fill="#12233f">Groups and signed errors</text><text x="240.0" y="297.0" font-size="26" text-anchor="middle" fill="#12233f">Why in this example?</text><text x="610.0" y="297.0" font-size="26" text-anchor="middle" fill="#12233f">Missing square</text><text x="240.0" y="379.0" font-size="26" text-anchor="middle" fill="#12233f">What changed?</text><text x="610.0" y="379.0" font-size="26" text-anchor="middle" fill="#12233f">Inputs versus rule</text><text x="240.0" y="461.0" font-size="26" text-anchor="middle" fill="#12233f">What survives?</text><text x="610.0" y="461.0" font-size="26" text-anchor="middle" fill="#12233f">Saved rows and scope</text></svg>