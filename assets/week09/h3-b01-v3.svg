<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Recover the procedure, then inspect the evidence"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Recover the procedure, then inspect the</text><text x="425" y="88.5" font-size="29" text-anchor="middle" fill="#12233f">evidence</text><rect x="60" y="145" width="260" height="130" rx="10" fill="none" stroke="#a43a4b" stroke-width="3"/><text x="190.0" y="187.0" font-size="27" text-anchor="middle" fill="#a43a4b">Runtime reset:</text><text x="190.0" y="227.5" font-size="27" text-anchor="middle" fill="#a43a4b">missing variables</text><path d="M330 210 L480 210" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><rect x="500" y="145" width="290" height="130" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="645.0" y="187.0" font-size="27" text-anchor="middle" fill="#147c80">Restart; run from</text><text x="645.0" y="227.5" font-size="27" text-anchor="middle" fill="#147c80">Setup</text><text x="425" y="420.0" font-size="27" text-anchor="middle" fill="#12233f">Copying a metric does not reconstruct a</text><text x="425" y="460.5" font-size="27" text-anchor="middle" fill="#12233f">missing execution.</text></svg>