<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="What can an input-only check fail to see?"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">What can an input-only check fail to see?</text><g class="node"><rect x="80" y="160" width="280" height="160" rx="10" fill="none" stroke="#657983" stroke-width="3"/><text x="220.0" y="208.95" font-size="27" text-anchor="middle" fill="#657983">Input monitor:</text><text x="220.0" y="249.45" font-size="27" text-anchor="middle" fill="#657983">unchanged in Task</text><text x="220.0" y="289.95" font-size="27" text-anchor="middle" fill="#657983">6</text></g><g class="node"><rect x="490" y="160" width="280" height="160" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="630.0" y="208.95" font-size="27" text-anchor="middle" fill="#147c80">Outcome errors:</text><text x="630.0" y="249.45" font-size="27" text-anchor="middle" fill="#147c80">changed in this</text><text x="630.0" y="289.95" font-size="27" text-anchor="middle" fill="#147c80">run</text></g><text x="425" y="430.0" font-size="28" text-anchor="middle" fill="#12233f">Identical input bytes do not certify</text><text x="425" y="472.0" font-size="28" text-anchor="middle" fill="#12233f">current accuracy.</text></svg>