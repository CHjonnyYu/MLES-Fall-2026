<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Model complexity does not remove evaluation"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Model complexity does not remove evaluation</text><rect x="25" y="180" width="180" height="130" rx="10" fill="none" stroke="#657983" stroke-width="3"/><text x="115.0" y="222.0" font-size="27" text-anchor="middle" fill="#657983">Declared</text><text x="115.0" y="262.5" font-size="27" text-anchor="middle" fill="#657983">comparison</text><path d="M210 245 L300 180" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><path d="M210 245 L300 345" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><rect x="320" y="110" width="490" height="140" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="565.0" y="152.0" font-size="27" text-anchor="middle" fill="#147c80">Simple model: inspect the</text><text x="565.0" y="192.5" font-size="27" text-anchor="middle" fill="#147c80">function directly</text><rect x="320" y="310" width="490" height="140" rx="10" fill="none" stroke="#a43a4b" stroke-width="3"/><text x="565.0" y="352.0" font-size="27" text-anchor="middle" fill="#a43a4b">LSTM / Transformer: retain the</text><text x="565.0" y="392.5" font-size="27" text-anchor="middle" fill="#a43a4b">same evidence questions</text><text x="425" y="485.0" font-size="22" text-anchor="middle" fill="#12233f">Representation differs; checks on data and outcomes still</text><text x="425" y="518.0" font-size="22" text-anchor="middle" fill="#12233f">matter.</text></svg>