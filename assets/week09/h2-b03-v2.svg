<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Different sets have different jobs"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Different sets have different jobs</text><g class="node"><rect x="240" y="90" width="370" height="75" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="425.0" y="116.7" font-size="27" text-anchor="middle" fill="#147c80">500 unique synthetic row</text><text x="425.0" y="157.2" font-size="27" text-anchor="middle" fill="#147c80">IDs</text></g><g class="node"><rect x="40" y="225" width="230" height="115" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="155.0" y="251.45" font-size="27" text-anchor="middle" fill="#147c80">Training: fit</text><text x="155.0" y="291.95" font-size="27" text-anchor="middle" fill="#147c80">scaler and</text><text x="155.0" y="332.45" font-size="27" text-anchor="middle" fill="#147c80">ridge</text></g><g class="node"><rect x="310" y="225" width="230" height="115" rx="10" fill="none" stroke="#657983" stroke-width="3"/><text x="425.0" y="251.45" font-size="27" text-anchor="middle" fill="#657983">Validation:</text><text x="425.0" y="291.95" font-size="27" text-anchor="middle" fill="#657983">choose</text><text x="425.0" y="332.45" font-size="27" text-anchor="middle" fill="#657983">candidate</text></g><g class="node"><rect x="580" y="225" width="230" height="115" rx="10" fill="none" stroke="#a43a4b" stroke-width="3"/><text x="695.0" y="271.7" font-size="27" text-anchor="middle" fill="#a43a4b">Test: evaluate</text><text x="695.0" y="312.2" font-size="27" text-anchor="middle" fill="#a43a4b">frozen choice</text></g><text x="425" y="435.0" font-size="27" text-anchor="middle" fill="#12233f">Fit is a learned operation. Predict reuses</text><text x="425" y="475.5" font-size="27" text-anchor="middle" fill="#12233f">fitted state.</text></svg>