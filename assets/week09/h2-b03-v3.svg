<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Locate the preprocessing leak"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Locate the preprocessing leak</text><rect x="240" y="90" width="370" height="75" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="425.0" y="132.0" font-size="27" text-anchor="middle" fill="#147c80">500 unique synthetic row</text><text x="425.0" y="172.5" font-size="27" text-anchor="middle" fill="#147c80">IDs</text><rect x="60" y="240" width="290" height="100" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="205.0" y="282.0" font-size="27" text-anchor="middle" fill="#147c80">Allowed:</text><text x="205.0" y="322.5" font-size="27" text-anchor="middle" fill="#147c80">fit(X_train)</text><rect x="495" y="240" width="290" height="100" rx="10" fill="none" stroke="#a43a4b" stroke-width="3"/><text x="640.0" y="282.0" font-size="27" text-anchor="middle" fill="#a43a4b">Forbidden:</text><text x="640.0" y="322.5" font-size="27" text-anchor="middle" fill="#a43a4b">fit(X_all)</text><text x="425" y="430.0" font-size="27" text-anchor="middle" fill="#12233f">Held-out inputs would influence a learned</text><text x="425" y="470.5" font-size="27" text-anchor="middle" fill="#12233f">scaler.</text><path d="M510 360 l255 -155 M510 205 l255 155" stroke="#a43a4b" stroke-width="3" opacity=".45"/></svg>