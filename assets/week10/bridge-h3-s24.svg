<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Compare predictions by observation ID"><rect width="800" height="550" rx="14" fill="#fffdf9"/><text x="36" y="50" fill="#12233f" font-family="Arial" font-size="27">Compare predictions by observation ID</text><rect x="30" y="82" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="108" font-family="Arial" font-size="19" fill="#52666b">Reference record</text><text x="48" y="142" font-family="Arial" font-size="23" fill="#12233f">run_id → baseline</text><text x="440" y="142" font-family="Arial" font-size="22" fill="#7f2635">run_id → candidate</text><rect x="30" y="178" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="204" font-family="Arial" font-size="19" fill="#52666b">Receiver record</text><text x="48" y="238" font-family="Arial" font-size="23" fill="#12233f">same saved test IDs</text><text x="440" y="238" font-family="Arial" font-size="22" fill="#7f2635">same frozen comparison</text><rect x="30" y="274" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="300" font-family="Arial" font-size="19" fill="#52666b">Declared tolerance</text><text x="48" y="334" font-family="Arial" font-size="23" fill="#12233f">atol = 1e-8</text><text x="440" y="334" font-family="Arial" font-size="22" fill="#7f2635">rtol = 1e-10</text><text x="36" y="390" font-family="Arial" font-size="21" fill="#52666b">Check both complete 120-row vectors.</text></svg>