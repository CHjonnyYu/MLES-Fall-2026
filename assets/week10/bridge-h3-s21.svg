<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Freeze the sender before test inspection"><rect width="800" height="550" rx="14" fill="#fffdf9"/><text x="36" y="50" fill="#12233f" font-family="Arial" font-size="27">Freeze the sender before test inspection</text><rect x="30" y="82" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="108" font-family="Arial" font-size="19" fill="#52666b">Held fixed</text><text x="48" y="142" font-family="Arial" font-size="23" fill="#12233f">raw inputs + train-only fit</text><text x="440" y="142" font-family="Arial" font-size="22" fill="#7f2635">360 / 120 / 120</text><rect x="30" y="178" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="204" font-family="Arial" font-size="19" fill="#52666b">One candidate change</text><text x="48" y="238" font-family="Arial" font-size="23" fill="#12233f">Ridge alpha 1 → 20</text><text x="440" y="238" font-family="Arial" font-size="22" fill="#7f2635">same SVD solver</text><rect x="30" y="274" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="300" font-family="Arial" font-size="19" fill="#52666b">Order</text><text x="48" y="334" font-family="Arial" font-size="23" fill="#12233f">validation → freeze</text><text x="440" y="334" font-family="Arial" font-size="22" fill="#7f2635">then test diagnosis</text><text x="36" y="390" font-family="Arial" font-size="21" fill="#52666b">Improvement is not a completion requirement.</text></svg>