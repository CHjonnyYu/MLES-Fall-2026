<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Membership and vector alignment are different properties"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Membership and vector alignment are different</text><text x="425" y="88.5" font-size="29" text-anchor="middle" fill="#12233f">properties</text><g class="node"><rect x="25" y="180" width="180" height="130" rx="10" fill="none" stroke="#657983" stroke-width="3"/><text x="115.0" y="234.2" font-size="27" text-anchor="middle" fill="#657983">Declared</text><text x="115.0" y="274.7" font-size="27" text-anchor="middle" fill="#657983">comparison</text></g><path d="M210 245 L300 180" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><path d="M210 245 L300 345" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><g class="node"><rect x="320" y="110" width="490" height="140" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="565.0" y="148.95" font-size="27" text-anchor="middle" fill="#147c80">Set filter: preserves</text><text x="565.0" y="189.45" font-size="27" text-anchor="middle" fill="#147c80">membership, may retain the wrong</text><text x="565.0" y="229.95" font-size="27" text-anchor="middle" fill="#147c80">order</text></g><g class="node"><rect x="320" y="310" width="490" height="140" rx="10" fill="none" stroke="#a43a4b" stroke-width="3"/><text x="565.0" y="369.2" font-size="27" text-anchor="middle" fill="#a43a4b">Saved-ID lookup: restores the</text><text x="565.0" y="409.7" font-size="27" text-anchor="middle" fill="#a43a4b">intended sequence too</text></g><text x="425" y="485.0" font-size="22" text-anchor="middle" fill="#12233f">Iterate over the saved ID sequence before comparing predictions.</text></svg>