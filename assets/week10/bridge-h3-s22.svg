<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Inspect the sender status and source"><rect width="800" height="550" rx="14" fill="#fffdf9"/><text x="36" y="50" fill="#12233f" font-family="Arial" font-size="27">Inspect the sender status and source</text><rect x="30" y="82" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="108" font-family="Arial" font-size="19" fill="#52666b">Inspect before running</text><text x="48" y="142" font-family="Arial" font-size="23" fill="#12233f">README + replay.py</text><text x="440" y="142" font-family="Arial" font-size="22" fill="#7f2635">requirements + versions</text><rect x="30" y="178" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="204" font-family="Arial" font-size="19" fill="#52666b">Inspect integrity</text><text x="48" y="238" font-family="Arial" font-size="23" fill="#12233f">manifest files hashes</text><text x="440" y="238" font-family="Arial" font-size="22" fill="#7f2635">CSV + source + contract</text><rect x="30" y="274" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="300" font-family="Arial" font-size="19" fill="#52666b">Scope marker</text><text x="48" y="334" font-family="Arial" font-size="23" fill="#12233f">classroom_demo = true</text><text x="440" y="334" font-family="Arial" font-size="22" fill="#7f2635">not graded Homework</text><text x="36" y="390" font-family="Arial" font-size="21" fill="#52666b">Presence checks are not proof of correct reasoning.</text></svg>