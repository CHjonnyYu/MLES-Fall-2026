<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Different bytes can preserve the records"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Different bytes can preserve the records</text><text x="240.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Object</text><text x="610.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Reference versus reordered</text><text x="610.0" y="156.0" font-size="24" text-anchor="middle" fill="#12233f">copy</text><path d="M55 175 H795" stroke="#657983" stroke-width="2"/><text x="240.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">CSV SHA256</text><text x="610.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">Different exact bytes</text><text x="240.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">ID-keyed records</text><text x="610.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">All values equal</text><text x="240.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Saved test IDs</text><text x="610.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Same sequence</text><text x="240.0" y="421.0" font-size="26" text-anchor="middle" fill="#12233f">Predictions</text><text x="610.0" y="421.0" font-size="26" text-anchor="middle" fill="#12233f">Within declared tolerance</text><text x="425" y="493.0" font-size="20" text-anchor="middle" fill="#12233f">Equality is checked, not inferred from a new manifest.</text></svg>