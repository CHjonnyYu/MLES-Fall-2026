<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="A split is more than three non-overlapping names"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">A split is more than three non-overlapping</text><text x="425" y="88.5" font-size="29" text-anchor="middle" fill="#12233f">names</text><text x="240.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Required property</text><text x="610.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Why it matters</text><path d="M55 175 H795" stroke="#657983" stroke-width="2"/><text x="240.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">Unique IDs</text><text x="610.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">No duplicate observations</text><text x="240.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">Disjoint groups</text><text x="610.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">No reused membership</text><text x="240.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Full union + counts</text><text x="610.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">No silently omitted rows</text><text x="240.0" y="421.0" font-size="26" text-anchor="middle" fill="#12233f">Saved sequence</text><text x="610.0" y="421.0" font-size="26" text-anchor="middle" fill="#12233f">Aligned prediction vector</text></svg>