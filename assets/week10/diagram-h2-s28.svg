<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="A receiver can follow the file-based procedure"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">A receiver can follow the file-based procedure</text><g class="node"><rect x="40" y="160" width="220" height="160" rx="10" fill="none" stroke="#147c80" stroke-width="3"/><text x="150.0" y="229.2" font-size="27" text-anchor="middle" fill="#147c80">ZIP: saved</text><text x="150.0" y="269.7" font-size="27" text-anchor="middle" fill="#147c80">handover</text></g><path d="M270 240 L325 240" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><g class="node"><rect x="345" y="160" width="220" height="160" rx="10" fill="none" stroke="#657983" stroke-width="3"/><text x="455.0" y="229.2" font-size="27" text-anchor="middle" fill="#657983">Extract and</text><text x="455.0" y="269.7" font-size="27" text-anchor="middle" fill="#657983">review source</text></g><path d="M575 240 L630 240" fill="none" stroke="#147c80" stroke-width="4" marker-end="url(#a)"/><g class="node"><rect x="650" y="160" width="160" height="160" rx="10" fill="none" stroke="#a43a4b" stroke-width="3"/><text x="730.0" y="188.7" font-size="27" text-anchor="middle" fill="#a43a4b">Execute</text><text x="730.0" y="229.2" font-size="27" text-anchor="middle" fill="#a43a4b">and</text><text x="730.0" y="269.7" font-size="27" text-anchor="middle" fill="#a43a4b">inspect</text><text x="730.0" y="310.2" font-size="27" text-anchor="middle" fill="#a43a4b">JSON</text></g><text x="425" y="455.0" font-size="25" text-anchor="middle" fill="#12233f">Save the edited notebook separately from the</text><text x="425" y="492.5" font-size="25" text-anchor="middle" fill="#12233f">supplied bundle.</text></svg>