<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Three hours, one connected learning path"><rect width="800" height="550" rx="14" fill="#fffdf9"/><text x="36" y="50" fill="#12233f" font-family="Arial" font-size="27">Three hours, one connected learning path</text><rect x="30" y="82" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="108" font-family="Arial" font-size="19" fill="#52666b">H1 · 14:00–15:00</text><text x="48" y="142" font-family="Arial" font-size="23" fill="#12233f">preserve observation IDs</text><text x="440" y="142" font-family="Arial" font-size="22" fill="#7f2635">Tasks 1–2</text><rect x="30" y="178" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="204" font-family="Arial" font-size="19" fill="#52666b">H2 · 15:00–16:00</text><text x="48" y="238" font-family="Arial" font-size="23" fill="#12233f">freeze, validate, replay</text><text x="440" y="238" font-family="Arial" font-size="22" fill="#7f2635">Tasks 3–5</text><rect x="30" y="274" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="300" font-family="Arial" font-size="19" fill="#52666b">H3 · 16:00–17:00</text><text x="48" y="334" font-family="Arial" font-size="23" fill="#12233f">Tasks 6–8 + bridge</text><text x="440" y="334" font-family="Arial" font-size="22" fill="#7f2635">40 + 20 min</text><text x="36" y="390" font-family="Arial" font-size="21" fill="#52666b">Choose the exercise OR the worked alternative.</text></svg>