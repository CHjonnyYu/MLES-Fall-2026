<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Extend the scope one explicit step at a time"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Extend the scope one explicit step at a time</text><text x="240.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Level</text><text x="610.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">What is reconstructed</text><path d="M55 175 H795" stroke="#657983" stroke-width="2"/><text x="240.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">Week 9</text><text x="610.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">CSV readback inside one</text><text x="610.0" y="244.0" font-size="26" text-anchor="middle" fill="#12233f">kernel</text><text x="240.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">Week 10</text><text x="610.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">Files in a new interpreter</text><text x="240.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Still shared</text><text x="610.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Installed dependencies and</text><text x="610.0" y="388.0" font-size="26" text-anchor="middle" fill="#12233f">observations</text><text x="425" y="493.0" font-size="20" text-anchor="middle" fill="#12233f">Computational replay is narrower than independent scientific</text><text x="425" y="523.0" font-size="20" text-anchor="middle" fill="#12233f">replication.</text></svg>