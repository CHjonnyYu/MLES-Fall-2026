<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Keep the checkpoint; change only a reviewed copy"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Keep the checkpoint; change only a reviewed</text><text x="425" y="88.5" font-size="29" text-anchor="middle" fill="#12233f">copy</text><text x="240.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Carry into H3</text><text x="610.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Keep fixed</text><path d="M55 175 H795" stroke="#657983" stroke-width="2"/><text x="240.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">Frozen bundle</text><text x="610.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">CSV, IDs and config</text><text x="240.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">Chosen candidate</text><text x="610.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">ridge-20</text><text x="240.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Original reference</text><text x="610.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Predictions and payload</text><text x="610.0" y="388.0" font-size="26" text-anchor="middle" fill="#12233f">digests</text><text x="425" y="493.0" font-size="20" text-anchor="middle" fill="#12233f">The next experiment changes CSV row order, not the validation</text><text x="425" y="523.0" font-size="20" text-anchor="middle" fill="#12233f">decision.</text></svg>