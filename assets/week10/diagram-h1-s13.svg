<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" font-family="Arial,sans-serif" role="img" aria-label="Choose the identity check that matches the claim"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147c80" stroke-width="1.3"/></marker></defs><text x="425" y="45.0" font-size="29" text-anchor="middle" fill="#12233f">Choose the identity check that matches the</text><text x="425" y="88.5" font-size="29" text-anchor="middle" fill="#12233f">claim</text><text x="240.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Claim</text><text x="610.0" y="120.0" font-size="24" text-anchor="middle" fill="#12233f">Appropriate check</text><path d="M55 175 H795" stroke="#657983" stroke-width="2"/><text x="240.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">Same bytes</text><text x="610.0" y="205.0" font-size="26" text-anchor="middle" fill="#12233f">Compare SHA256</text><text x="240.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">Same records</text><text x="610.0" y="277.0" font-size="26" text-anchor="middle" fill="#12233f">Compare every ID-keyed</text><text x="610.0" y="316.0" font-size="26" text-anchor="middle" fill="#12233f">value</text><text x="240.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Same scientific meaning</text><text x="610.0" y="349.0" font-size="26" text-anchor="middle" fill="#12233f">Source and domain evidence</text><text x="425" y="493.0" font-size="20" text-anchor="middle" fill="#12233f">Task 6 tests changed bytes with preserved records; it does not</text><text x="425" y="523.0" font-size="20" text-anchor="middle" fill="#12233f">validate measurement meaning.</text></svg>