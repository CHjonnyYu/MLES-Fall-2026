<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="A finished run can still be a draft"><rect width="800" height="550" rx="14" fill="#fffdf9"/><text x="36" y="50" fill="#12233f" font-family="Arial" font-size="27">A finished run can still be a draft</text><rect x="30" y="82" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="108" font-family="Arial" font-size="19" fill="#52666b">Missing package</text><text x="48" y="142" font-family="Arial" font-size="23" fill="#12233f">returncode = None</text><text x="440" y="142" font-family="Arial" font-size="22" fill="#7f2635">upload required</text><rect x="30" y="178" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="204" font-family="Arial" font-size="19" fill="#52666b">Missing negative test</text><text x="48" y="238" font-family="Arial" font-size="23" fill="#12233f">expected_rejection = false</text><text x="440" y="238" font-family="Arial" font-size="22" fill="#7f2635">incomplete evidence</text><rect x="30" y="274" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="300" font-family="Arial" font-size="19" fill="#52666b">Honest export</text><text x="48" y="334" font-family="Arial" font-size="23" fill="#12233f">draft or unresolved failure</text><text x="440" y="334" font-family="Arial" font-size="22" fill="#7f2635">retain the actual log</text><text x="36" y="390" font-family="Arial" font-size="21" fill="#52666b">Text completeness is not correctness or peer verification.</text></svg>