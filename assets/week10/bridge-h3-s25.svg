<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Keep target error and replay difference apart"><rect width="800" height="550" rx="14" fill="#fffdf9"/><text x="36" y="50" fill="#12233f" font-family="Arial" font-size="27">Keep target error and replay difference apart</text><rect x="30" y="82" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="108" font-family="Arial" font-size="19" fill="#52666b">Target error</text><text x="48" y="142" font-family="Arial" font-size="23" fill="#12233f">prediction − temperature rise</text><text x="440" y="142" font-family="Arial" font-size="22" fill="#7f2635">units: °C difference</text><rect x="30" y="178" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="204" font-family="Arial" font-size="19" fill="#52666b">Replay difference</text><text x="48" y="238" font-family="Arial" font-size="23" fill="#12233f">receiver − saved prediction</text><text x="440" y="238" font-family="Arial" font-size="22" fill="#7f2635">same run_id</text><rect x="30" y="274" width="740" height="83" rx="8" fill="#e5eeea"/><text x="48" y="300" font-family="Arial" font-size="19" fill="#52666b">Interpretation</text><text x="48" y="334" font-family="Arial" font-size="23" fill="#12233f">A poor predictor can replay</text><text x="440" y="334" font-family="Arial" font-size="22" fill="#7f2635">with zero difference</text><text x="36" y="390" font-family="Arial" font-size="21" fill="#52666b">Show both actual charts; name what each compares.</text></svg>